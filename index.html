<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toko Lyra - Cantik & Murah</title>
<style>
body{font-family:sans-serif;margin:0;background:#fff0f5;color:#333}
header{background:#ff69b4;color:white;padding:20px;text-align:center}
h1{margin:0}
.products{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:15px}
.card{background:white;border-radius:15px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,0.1);text-align:center}
.card img{width:100%;border-radius:10px}
.price{color:#ff1493;font-weight:bold;font-size:18px}
.btn{display:block;background:#ff69b4;color:white;padding:10px;border-radius:20px;text-decoration:none;margin-top:10px}
</style>
</head>
<body>
<header>
<h1>✨ TOKO LYRA ✨</h1>
<p>Cantik, Murah, Kekinian!</p>
</header>

<div class="products">
<div class="card">
<img src="https://via.placeholder.com/300x300/ff69b4/ffffff?text=Lyra+1">
<h3>Dress Cantik</h3>
<div class="price">Rp 89.000</div>
<a class="btn" href="https://wa.me/6281234567890?text=Hai%20kak%20mau%20pesan%20Dress">Pesan WA</a>
</div>

<div class="card">
<img src="https://via.placeholder.com/300x300/ffb6c1/ffffff?text=Lyra+2">
<h3>Tas Lucu</h3>
<div class="price">Rp 65.000</div>
<a class="btn" href="https://wa.me/6281234567890?text=Hai%20kak%20mau%20pesan%20Tas">Pesan WA</a>
</div>
</div>

</body>
</html>
