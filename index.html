<!DOCTYPE html>
<html lang="id" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>LYRA STORE</title>
<style>
body{margin:0;font-family:sans-serif;background:#fff0f5}
header{background:linear-gradient(135deg,#ff5a8a,#ff8fb7);color:white;padding:25px;text-align:center}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px;max-width:800px;margin:auto}
.card{background:white;border-radius:15px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.card img{width:100%;height:170px;object-fit:cover}
.info{padding:10px}
.price{color:#ff5a8a;font-weight:bold}
.btn{width:100%;background:#ff5a8a;color:white;border:none;padding:8px;border-radius:8px;margin-top:5px}
</style>
</head>
<body>
<header><h1>LYRA STORE</h1><p>✨ Cantik Elegan Kekinian ✨</p></header>
<div class="products">
<div class="card"><img src="https://images.unsplash.com/photo-1515372039744-3d0f6be8b6be?w=400"><div class="info"><b>Dress Floral</b><div class="price">Rp 189.000</div><button class="btn">Beli</button></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=400"><div class="info"><b>Blouse Putih</b><div class="price">Rp 129.000</div><button class="btn">Beli</button></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1581044777550-4cfa60707c03?w=400"><div class="info"><b>Set Korean</b><div class="price">Rp 245.000</div><button class="btn">Beli</button></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1554412933-514a83d2f3c0?w=400"><div class="info"><b>Tas LYRA</b><div class="price">Rp 159.000</div><button class="btn">Beli</button></div></div>
</div>
</body>
</html>
